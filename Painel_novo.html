<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Telão Estimativa</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
    :root {
        --primary-red: #e60000;
        --primary-icon: red;
        --bg-light: #f4f4f4;
        --text-color: #333;
        --card-bg: #ffffff;
        --input-bg: #eeeeee;
        --border-color: #dddddd;
    }

    body.dark-mode {
        --primary-red: yellow;
        --primary-icon: red;
        --bg-light: #0f0f0f;
        --text-color: #ffffff;
        --card-bg: #1a1a1a;
        --input-bg: #2d2d2d;
        --border-color: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
        background-color: var(--bg-light);
        color: var(--text-color);
        transition: all 0.3s ease;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    #particles-js { position: absolute; width: 100%; height: 100%; z-index: 1; top: 0; left: 0; }

    /* --- SETUP OVERLAY (TELA INICIAL) --- */
    #setup-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; background: rgba(0,0,0,0.85);
    }

    .login-card {
        background: var(--card-bg);
        padding: clamp(20px, 5vh, 40px);
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 90%;
        max-width: 450px;
        text-align: center;
        border-top: 8px solid var(--primary-red);
        z-index: 10000;
    }

    .login-card h2 { margin-bottom: 20px; color: var(--primary-red); font-size: clamp(1.5rem, 4vh, 2.5rem); }

    .login-card input {
        width: 100%; padding: 15px; margin-bottom: 15px;
        border: 2px solid var(--border-color); border-radius: 10px;
        background: var(--input-bg); color: var(--text-color);
        font-size: 1.2rem; text-align: center; text-transform: uppercase; outline: none;
    }

    .main-btn {
        background: var(--primary-red); color: white; border: none;
        padding: 15px; width: 100%; border-radius: 8px;
        cursor: pointer; font-weight: bold; font-size: 1.2rem;
        transition: 0.3s; margin-bottom: 10px;
    }

    /* --- PAINEL DE RANKING --- */
    #ranking-panel {
        display: none; 
        width: 98vw; 
        max-width: 1400px;
        background: var(--card-bg); 
        padding: 2vh 2vw;
        border-radius: 20px; 
        z-index: 10;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        max-height: 96vh; 
        display: flex;
        flex-direction: column;
        text-align: center;
    }

    h1#title-sala {
        font-size: clamp(1.5rem, 6vh, 4.5rem);
        color: var(--primary-red);
        margin-bottom: 1vh;
        text-transform: uppercase;
        line-height: 1;
    }

    .info-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 1.5vh; }

    .info-box {
        background: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1vh 2vw; flex: 1; max-width: 250px;
    }

    .info-label { font-size: clamp(0.7rem, 2vh, 1.2rem); font-weight: bold; opacity: 0.7; text-transform: uppercase; }
    .info-value { font-size: clamp(1.5rem, 5vh, 3.5rem); color: var(--primary-red); font-weight: 900; line-height: 1; }

    /* --- LISTA DE JOGADORES --- */
    #ranking-list { list-style: none; padding: 0; width: 100%; overflow-y: auto; flex-grow: 1; }
    
    #ranking-list li {
        display: flex; justify-content: space-between; align-items: center;
        padding: 1.5vh 2vw; margin-bottom: 1vh;
        background: var(--input-bg); border-radius: 12px;
        font-size: clamp(1.2rem, 5vh, 3.5rem); font-weight: bold;
        border: 1px solid var(--border-color);
    }

    .rank-num { width: 12%; text-align: left; color: var(--primary-red); opacity: 0.8; }
    .rank-name { flex-grow: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
    
    .rank-estimate {
        background-color: var(--primary-red);
        color: white;
        width: clamp(40px, 8vh, 90px);
        height: clamp(40px, 8vh, 90px);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: clamp(1rem, 4vh, 2.8rem);
        font-weight: 900; margin: 0 2vw; flex-shrink: 0;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .rank-pts { min-width: 22%; text-align: right; color: var(--primary-red); white-space: nowrap; }
    .rank-pts small { font-size: 0.5em; vertical-align: middle; }

    /* --- RESPONSIVIDADE SMARTPHONE (RETRATO) --- */
    @media (max-width: 600px) {
        #ranking-panel { padding: 10px; width: 96vw; }
        h1#title-sala { font-size: 1.8rem; margin-bottom: 5px; }
        .info-value { font-size: 1.8rem; }
        .info-label { font-size: 0.7rem; }
        #ranking-list li { padding: 8px 12px; margin-bottom: 6px; font-size: 1.1rem; }
        .rank-num { width: 10%; font-size: 0.9rem; }
        .rank-estimate { width: 35px; height: 35px; font-size: 1.1rem; margin: 0 8px; }
        .rank-pts { min-width: 25%; font-size: 1.2rem; }
    }

    /* --- ELEMENTOS ADICIONAIS --- */
    .theme-toggle {
        position: fixed; top: 15px; right: 15px;
        background: var(--card-bg); border: none; padding: 10px;
        border-radius: 50%; cursor: pointer; z-index: 1000;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); color: var(--text-color);
    }

    #back-icon {
        position: fixed; bottom: 15px; right: 15px;
        width: 50px; height: 50px; background: var(--primary-icon);
        color: white; border-radius: 50%; display: none;
        align-items: center; justify-content: center;
        cursor: pointer; z-index: 1000; font-size: 20px;
    }

    #room-display-footer {
        position: fixed; bottom: 5px; left: 50%; transform: translateX(-50%);
        font-size: 0.7rem; opacity: 0.5; z-index: 5;
    }

    body.dark-mode .rank-estimate { color: #000; }
</style>
</head>
<body>
    <div id="particles-js"></div>

    <button class="theme-toggle" onclick="toggleTheme()">
        <i id="theme-icon" class="fas fa-moon"></i>
    </button>

    <div id="setup-overlay">
        <div class="login-card">
            <h2><i class="fas fa-trophy"></i> RANKING</h2>
            <input type="text" id="room-input" placeholder="NOME DA SALA" maxlength="15">
            <button class="main-btn" onclick="conectarPainel()">ABRIR TELÃO</button>
            <button class="main-btn" style="background:#666" onclick="window.location.href='index.html'">VOLTAR</button>
        </div>
    </div>

    <div id="ranking-panel">
        <h1 id="title-sala">ESTIMATIVA</h1>
        
        <div class="info-container">
            <div class="info-box">
                <div class="info-label">Rodada</div>
                <div id="display-rodada" class="info-value">-</div>
            </div>
            <div class="info-box">
                <div class="info-label">Estimativas</div>
                <div id="display-estimativas" class="info-value">-</div>
            </div>
        </div>

        <ul id="ranking-list"></ul>
    </div>

    <div id="room-display-footer">SALA: <span id="room-id-text">-</span></div>

    <div id="back-icon" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAtB6aqEBIqtqmKMNdylVIosgjGQwOxGVc",
            authDomain: "estimativa-482421.firebaseapp.com",
            databaseURL: "https://estimativa-482421-default-rtdb.firebaseio.com",
            projectId: "estimativa-482421",
            storageBucket: "estimativa-482421.firebasestorage.app",
            messagingSenderId: "121884408752",
            appId: "1:121884408752:web:a6f6048c1b4db7e4c03475"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function conectarPainel() {
            let roomId = document.getElementById('room-input').value.trim().toUpperCase();
            if (!roomId) return alert("Por favor, digite o nome da sala.");

            let isHistoryMode = roomId.startsWith("H-");
            document.getElementById('setup-overlay').style.display = 'none';
            document.getElementById('ranking-panel').style.display = 'block';
            document.getElementById('back-icon').style.display = 'flex';
            document.getElementById('room-id-text').innerText = roomId;
            
            if (isHistoryMode) {
                document.getElementById('title-sala').innerText = "HISTÓRICO ESTIMATIVA";
                document.getElementById('title-sala').style.color = "#888";
            }

            const dbPath = isHistoryMode ? 'historico/' : 'salas/';

            db.ref(dbPath + roomId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.jogadors) {
                    processarRanking(data.jogadors);
                } else if (isHistoryMode) {
                    alert("Histórico não encontrado.");
                    location.reload();
                }
            });
        }

    function processarRanking(jogadoresData) {
    let ranking = [];
    let rodadaAtual = 1;
    let somaEstimativasRodada = 0;
    let jogoFinalizado = true;

    const jogadoresArray = Object.values(jogadoresData).filter(j => j && j.nome);

    // 1. Determinar a Rodada Ativa no Painel
    let ultimaRodadaComDados = 1;
    jogadoresArray.forEach(j => {
        if (j.estimates) {
            j.estimates.forEach((est, index) => {
                if (est !== undefined && est !== null && est !== "") {
                    if (index + 1 > ultimaRodadaComDados) ultimaRodadaComDados = index + 1;
                }
            });
        }
        if (j.scores) {
            j.scores.forEach((sc, index) => {
                if (sc !== undefined && sc !== null && sc !== "") {
                    if (index + 1 > ultimaRodadaComDados) ultimaRodadaComDados = index + 1;
                }
            });
        }
    });

    // 2. Lógica de Transição: Verificar se a rodada atual já foi totalmente pontuada
    let todosPontuaramNaRodada = true;
    jogadoresArray.forEach(j => {
        const pontoRodada = j.scores ? j.scores[ultimaRodadaComDados - 1] : null;
        if (pontoRodada === undefined || pontoRodada === null || pontoRodada === "") {
            todosPontuaramNaRodada = false;
        }
    });

    if (todosPontuaramNaRodada && ultimaRodadaComDados < 12) {
        rodadaAtual = ultimaRodadaComDados + 1;
    } else {
        rodadaAtual = ultimaRodadaComDados;
    }

    // 3. Calcular Pontos Totais e Estimativa Individual para a bolinha
    ranking = jogadoresArray.map(j => {
        let totalPts = 0;
        let estIndividual = 0;

        // Soma as estimativas apenas da rodada que o painel está mostrando
        if (j.estimates && j.estimates[rodadaAtual - 1] !== undefined) {
            const e = parseInt(j.estimates[rodadaAtual - 1]);
            if (!isNaN(e)) {
                somaEstimativasRodada += e;
                estIndividual = e; // Valor que aparecerá na bolinha
            }
        }

        // Verifica se o jogo acabou
        if (!j.scores || j.scores[11] === undefined || j.scores[11] === "" || j.scores[11] === null) {
            jogoFinalizado = false;
        }

        // Soma total de pontos acumulados
        if (j.scores) {
            j.scores.forEach(s => {
                const val = parseInt(s);
                if (!isNaN(val)) totalPts += val;
            });
        }
        
        return { 
            nome: j.nome, 
            pontos: totalPts, 
            estimativa: estIndividual 
        };
    });

    // Atualiza Quadros de Informação no Topo
    document.getElementById('display-rodada').innerText = rodadaAtual + "ª";
    document.getElementById('display-estimativas').innerText = somaEstimativasRodada;

    // 4. Ordenar Ranking por Pontos (do maior para o menor)
    ranking.sort((a, b) => b.pontos - a.pontos);

// --- CONTROLO DA COMEMORAÇÃO (SOM 2X E CONFETES 15S) ---
    if (jogoFinalizado) {
        if (!window.jaComemorou) {
            // 1. Inicia os confetes gigantes
            lancarConfetes();
            
            // 2. Configura o Áudio para tocar apenas 2 vezes
            window.audioVitoria = new Audio('vitoria.mp3');
            window.audioVitoria.volume = 1.0;
            let vezesTocadas = 0;

            window.audioVitoria.addEventListener('ended', function() {
                vezesTocadas++;
                if (vezesTocadas < 2) {
                    this.currentTime = 0;
                    this.play();
                }
            }, false);

            window.audioVitoria.play().catch(e => console.log("Áudio bloqueado. Clique na tela."));

            // 3. Define o intervalo para os confetes continuarem caindo
            window.intervaloConfete = setInterval(lancarConfetes, 3000);

            // 4. PARA TUDO após 15 segundos (15000ms)
            window.timeoutFinalizacao = setTimeout(() => {
                clearInterval(window.intervaloConfete); // Para de gerar novos confetes
                if (window.audioVitoria) {
                    window.audioVitoria.pause(); // Opcional: para o som se ainda estiver na 2ª vez
                }
                console.log("Comemoração finalizada automaticamente.");
            }, 10000);

            window.jaComemorou = true;
        }
    } else {
        // Se o jogo for reiniciado antes dos 15s, limpa todos os timers e para o som
        window.jaComemorou = false;
        if (window.intervaloConfete) clearInterval(window.intervaloConfete);
        if (window.timeoutFinalizacao) clearTimeout(window.timeoutFinalizacao);
        
        if (window.audioVitoria) {
            window.audioVitoria.pause();
            window.audioVitoria.currentTime = 0;
        }
    }




    // 5. Renderizar a Lista com a Bolinha de Estimativa
    const listElement = document.getElementById('ranking-list');
    let html = "";
    let posExibida = 0;
    let ultimoScore = null;

    ranking.forEach((jogador) => {
        if (jogador.pontos !== ultimoScore) posExibida++;
        ultimoScore = jogador.pontos;

        let medalha = "";
        if (jogoFinalizado) {
            if (posExibida === 1) medalha = "🏆 ";
            else if (posExibida === 2) medalha = "🥈 ";
            else if (posExibida === 3) medalha = "🥉 ";
        }

        html += `
            <li>
                <span class="rank-num">${posExibida}º</span>
                <span class="rank-name">${medalha}${jogador.nome}</span>
                <span class="rank-estimate">${jogador.estimativa}</span>
                <span class="rank-pts">${jogador.pontos} <small style="font-size: 0.6em">pts</small></span>
            </li>
        `;
    });

    listElement.innerHTML = html;
}

        // Partículas
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 60 },
                "color": { "value": "#e60000" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#e60000", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.5 }
            }
        });

        document.getElementById('room-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') conectarPainel();
        });

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const salaUrl = urlParams.get('sala');
            if (salaUrl) {
                document.getElementById('room-input').value = salaUrl.toUpperCase();
                conectarPainel();
            }
        };
		
function lancarConfetes() {
    var duration = 3 * 1000;
    var animationEnd = Date.now() + duration;
    
    // scalar: 4 torna os confetes gigantes, ideais para telões
    // zIndex: 99999 garante que fiquem à frente de tudo
    var defaults = { 
        startVelocity: 35, 
        spread: 360, 
        ticks: 60, 
        zIndex: 99999, 
        scalar: 4 
    };

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    var interval = setInterval(function() {
      var timeLeft = animationEnd - Date.now();

      if (timeLeft <= 0) {
        return clearInterval(interval);
      }

      var particleCount = 40 * (timeLeft / duration);
      
      // Disparo da esquerda
      confetti(Object.assign({}, defaults, { 
        particleCount, 
        origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
      }));
      
      // Disparo da direita
      confetti(Object.assign({}, defaults, { 
        particleCount, 
        origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
      }));
    }, 250);
}
    </script>
</body>
</html>
